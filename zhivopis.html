<style>

  header{text-align:center;padding:26px 16px 8px;}
  .brand{font-size:clamp(24px,6vw,44px);font-weight:900;letter-spacing:.04em;color:var(--gold);

  .msg{margin-top:12px;font-size:14px;color:#d8d2c4;font-style:italic;border-left:3px solid var(--gold);padding-left:12px;}

</head>
