<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧰 Полезное — шефу и моряку</title>
<style>
  :root{--ink:#22323c;--muted:#6a7b86;--line:#d9e6ee;--teal:#0e9aa7;--teal2:#0b7f8a;--blue:#2b7fd4}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.6;
    background:radial-gradient(60% 40% at 15% 0%,rgba(14,154,167,.14),transparent 60%),linear-gradient(180deg,#f4fafc,#e9f2f7);min-height:100vh}
  .wrap{max-width:620px;margin:0 auto;padding:26px 16px 60px}
  h1{text-align:center;font-size:26px;font-weight:900;color:var(--teal2);margin-bottom:4px}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 12px 28px rgba(30,60,80,.07)}
  h2{font-size:18px;font-weight:800;margin-bottom:12px;color:var(--teal2)}
  label{font-weight:700;font-size:13px;display:block;margin:10px 0 5px}
  input,textarea{width:100%;padding:11px 12px;font-size:16px;border:2px solid var(--line);border-radius:11px;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--teal)}
  .btn{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;cursor:pointer;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 8px 18px rgba(14,154,167,.28)}
  .out{margin-top:12px;font-size:15px}
  .big{font-size:30px;font-weight:900;color:var(--teal2)}
  .rate{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
  .rate b{color:var(--teal2)}
  .contact{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .contact a{flex:1;min-width:140px;text-align:center;text-decoration:none;font-weight:800;padding:12px;border-radius:12px}
  .call{background:#0e9aa7;color:#fff}.tg{background:#2b9fd4;color:#fff}
  .muted{color:var(--muted);font-size:13px}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧰 Полезное</h1>
  <p class="sub">Шефу и моряку: погода · курс валют · контакты</p>

  <!-- ПОГОДА -->
  <div class="card">
    <h2>🌤 Погода</h2>
    <label>Город</label>
    <input id="city" placeholder="например, Астрахань" value="Астрахань">
    <button class="btn" onclick="getWeather()">Показать погоду</button>
    <div class="out" id="wout"></div>
  </div>

  <!-- КУРС -->
  <div class="card">
    <h2>💱 Курс валют (ЦБ мира → рубль)</h2>
    <div id="rates"><span class="muted">Загружаю курсы…</span></div>
    <button class="btn" onclick="getRates()" style="margin-top:14px">Обновить</button>
  </div>

  <!-- КОНТАКТЫ + ЗАКАЗ -->
  <div class="card">
    <h2>🍽 Заказать шефа / связаться</h2>
    <div class="contact">
      <a class="call" href="tel:+79819312482">📞 Позвонить</a>
      <a class="tg" href="https://t.me/cook46_bot" target="_blank" rel="noopener">✈️ Telegram</a>
    </div>
    <label style="margin-top:16px">Ваше имя</label>
    <input id="oname" placeholder="Имя">
    <label>Дата / событие</label>
    <input id="odate" placeholder="напр. 20 июля, дача">
    <label>Телефон</label>
    <input id="ophone" placeholder="+7 ...">
    <label>Пожелания</label>
    <textarea id="owish" rows="2" placeholder="Шашлык на 10 человек..."></textarea>
    <button class="btn" onclick="sendOrder()">📩 Отправить заявку</button>
    <p class="muted" style="margin-top:8px">Заявка откроется в вашей почте — просто нажмите «Отправить».</p>
  </div>

  <footer>Cook46 · +7 981 931-24-82</footer>
</div>

<script>
  async function getWeather(){
    var city=(document.getElementById("city").value||"").trim();
    var out=document.getElementById("wout");
    if(!city){ out.textContent="Введите город."; return; }
    out.textContent="Загружаю…";
    try{
      var g=await (await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=ru")).json();
      if(!g.results||!g.results.length){ out.textContent="Город не найден."; return; }
      var loc=g.results[0];
      var w=await (await fetch("https://api.open-meteo.com/v1/forecast?latitude="+loc.latitude+"&longitude="+loc.longitude+"&current=temperature_2m,wind_speed_10m,weather_code")).json();
      var c=w.current, t=Math.round(c.temperature_2m), wind=Math.round(c.wind_speed_10m);
      var codes={0:"☀️ Ясно",1:"🌤 В основном ясно",2:"⛅ Переменная облачность",3:"☁️ Пасмурно",45:"🌫 Туман",48:"🌫 Туман",
        51:"🌦 Морось",61:"🌧 Дождь",63:"🌧 Дождь",65:"🌧 Ливень",71:"🌨 Снег",73:"🌨 Снег",75:"❄️ Сильный снег",80:"🌦 Ливни",95:"⛈ Гроза"};
      var desc=codes[c.weather_code]||"—";
      out.innerHTML='<div class="big">'+t+'°C</div>'+desc+' · ветер '+wind+' км/ч<br><span class="muted">'+loc.name+(loc.country?", "+loc.country:"")+'</span>';
    }catch(e){ out.innerHTML='<span class="muted">Не удалось загрузить (возможно, нужен интернет/VPN).</span>'; }
  }
  async function getRates(){
    var box=document.getElementById("rates");
    box.innerHTML='<span class="muted">Загружаю курсы…</span>';
    try{
      var d=await (await fetch("https://open.er-api.com/v6/latest/USD")).json();
      var usdrub=d.rates.RUB, eurrub=d.rates.RUB/d.rates.EUR, cnyrub=d.rates.RUB/d.rates.CNY;
      box.innerHTML=
        '<div class="rate"><span>🇺🇸 1 USD</span><b>'+usdrub.toFixed(2)+' ₽</b></div>'+
        '<div class="rate"><span>🇪🇺 1 EUR</span><b>'+eurrub.toFixed(2)+' ₽</b></div>'+
        '<div class="rate"><span>🇨🇳 1 CNY</span><b>'+cnyrub.toFixed(2)+' ₽</b></div>'+
        '<span class="muted">Обновлено: '+(d.time_last_update_utc||"").slice(0,16)+'</span>';
    }catch(e){ box.innerHTML='<span class="muted">Не удалось загрузить курсы (нужен интернет/VPN).</span>'; }
  }
  function sendOrder(){
    var n=document.getElementById("oname").value, dt=document.getElementById("odate").value,
        ph=document.getElementById("ophone").value, w=document.getElementById("owish").value;
    var body="Заявка шефу:%0D%0AИмя: "+encodeURIComponent(n)+"%0D%0AДата: "+encodeURIComponent(dt)+
      "%0D%0AТелефон: "+encodeURIComponent(ph)+"%0D%0AПожелания: "+encodeURIComponent(w);
    window.location.href="mailto:asolonn1303@gmail.com?subject="+encodeURIComponent("Заказ шефа с сайта")+"&body="+body;
  }
  getRates();
</script>
</body>
</html>
